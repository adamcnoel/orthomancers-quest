name: Tests

on:
  push:
    branches: [main, "refactor/**", "fix/**", "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate corpus
        run: node tools/validate-corpus.js
      - name: Run state and playthrough tests
        run: node tests/run.js
