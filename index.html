<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090704">
  <title>Orthomancer's Quest</title>
  <link rel="stylesheet" href="style.css?app=orthomancer&v=0.5.0">
  <link rel="stylesheet" href="focus-terminal.css?app=orthomancer&v=0.5.0">
</head>
<body class="booting">
  <main class="app-shell">
    <div class="boot-status" id="boot-status" role="status">Loading archive…</div>

    <div class="focus-top">
      <header>
        <div class="kicker">The Corrupted Archive</div>
        <h1>Orthomancer's Quest</h1>
      </header>
      <div class="controls">
        <div class="mode-switch" aria-label="Difficulty mode">
          <button id="mode-standard" type="button">Standard</button>
          <button id="mode-advanced" type="button">Advanced</button>
        </div>
        <button class="reset-button" id="reset-archive" type="button">Reset archive</button>
      </div>
    </div>

    <p class="subtitle">Inspect each fragment for spelling corruption. Restore the archive one word at a time.</p>

    <section class="panel home-card hidden" id="home-card" aria-live="polite">
      <div class="home-kicker" id="home-kicker">Archive status</div>
      <h2 id="home-title">Archive ready.</h2>
      <p id="home-detail"></p>
      <button class="next-button home-start" id="begin-study" type="button">Begin study</button>
    </section>

    <section class="panel study-card hidden" id="study-card" aria-live="polite">
      <p class="prompt" id="prompt"></p>
      <div class="sentences" id="sentences"></div>
      <div class="feedback hidden" id="feedback"></div>
      <div class="next-row">
        <button class="next-button hidden" id="next-button" type="button">Next fragment</button>
      </div>
    </section>

    <section class="focus-status">
      <div class="panel restoration">
        <div class="restoration-row">
          <span class="restoration-title">Archive restoration</span>
          <strong id="restoration-percent">0%</strong>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="restoration-fill"></div>
        </div>
      </div>

      <div class="stats-strip" aria-label="Progress">
        <div class="stat">
          <span class="stat-value" id="answered">0</span>
          <span class="stat-label">Answered</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="accuracy">0%</span>
          <span class="stat-label">Accuracy</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="streak">0</span>
          <span class="stat-label">Streak</span>
        </div>
        <div class="stat">
          <span class="stat-value"><span id="mastered">0</span>/<span id="mastered-total">0</span></span>
          <span class="stat-label">Mastered</span>
        </div>
      </div>
    </section>

    <p class="footer-note"><span id="build-version">Build loading…</span> · <span id="corpus-status">Corpus loading…</span></p>
  </main>

  <script src="words.js?app=orthomancer&v=0.5.0"></script>
  <script src="corpus-curation.js?app=orthomancer&v=0.5.0"></script>
  <script src="game-core.js?app=orthomancer&v=0.5.0"></script>
  <script src="startup-state.js?app=orthomancer&v=0.5.0"></script>
  <script src="app.js?app=orthomancer&v=0.5.0"></script>
</body>
</html>
