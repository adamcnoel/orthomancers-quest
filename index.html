<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17140f">
  <title>Orthomancer's Quest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header>
      <div class="kicker">The Corrupted Archive</div>
      <h1>Orthomancer's Quest</h1>
      <p class="subtitle">Inspect each fragment for spelling corruption. Restore the archive one word at a time.</p>
    </header>

    <section class="top-grid" aria-label="Progress">
      <div class="panel stats">
        <div class="stat">
          <span class="stat-value" id="answered">0</span>
          <span class="stat-label">Answered</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="accuracy">0%</span>
          <span class="stat-label">Accuracy</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="streak">0</span>
          <span class="stat-label">Streak</span>
        </div>
        <div class="stat">
          <span class="stat-value"><span id="mastered">0</span>/<span id="mastered-total">0</span></span>
          <span class="stat-label">Mastered</span>
        </div>
      </div>

      <div class="panel restoration">
        <div class="restoration-row">
          <span class="restoration-title">Archive restoration</span>
          <strong id="restoration-percent">0%</strong>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="restoration-fill"></div>
        </div>
      </div>
    </section>

    <div class="controls">
      <div class="mode-switch" aria-label="Difficulty mode">
        <button id="mode-standard" type="button">Standard</button>
        <button id="mode-advanced" type="button">Advanced</button>
      </div>
      <button class="reset-button" id="reset-progress" type="button">Reset progress</button>
    </div>

    <section class="panel study-card" aria-live="polite">
      <p class="prompt" id="prompt"></p>
      <div class="sentences" id="sentences"></div>
      <div class="feedback hidden" id="feedback"></div>
      <div class="next-row">
        <button class="next-button hidden" id="next-button" type="button">Next fragment</button>
      </div>
    </section>

    <p class="footer-note">Prototype corpus only. HSPT-core words will replace and expand this set when supplied.</p>
  </main>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
